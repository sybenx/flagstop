# Build the review from the agency's feed and OSM, and publish the page on GitHub Pages: daily, and when run by
# hand (Actions -> publish -> Run workflow). Off until the repository variable PUBLISH is set to "yes" (Settings
# -> Secrets and variables -> Actions -> Variables) and Pages is set to deploy from GitHub Actions (Settings -> Pages).
# FEED_QUERY (a variable too) says which feed: a Mobility Database search, as tool/catalog.py takes it.
name: publish
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PUBLISH == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pyosmium reads the regional extract (tool/extract.py), and its test needs it
      - name: pyosmium
        run: pip install osmium
      # the rules and the upload path first: a failing test stops the publish before anything is built
      - name: tests (rules; the edit basket, osmChange, split and repair)
        run: |
          python3 -m unittest discover -s tests
          node tests/edits_test.js
      # what the last build kept: feed summaries (for "since the last feed"), other agencies' feeds, the catalog
      - uses: actions/cache@v4
        with:
          path: cache
          key: flagstop-${{ github.run_id }}
          restore-keys: flagstop-
      # variables reach the shell as environment, never pasted into the script
      - name: the feed
        env:
          FEED_QUERY: ${{ vars.FEED_QUERY || 'cache valley' }}
        run: python3 tool/catalog.py "$FEED_QUERY" --get
      # FEED_ALSO (a variable, optional): another agency sharing stops, as review.py --also takes it
      # (a GTFS URL, or passio:<system id>:<agency name> for a campus shuttle on Passio GO)
      # OSM from Geofabrik's regional extract, not public Overpass (busy, and slower every year): kept in the cache,
      # brought up to date with its daily changes. If that fails, yesterday's OSM data (in the cache) is used:
      # the review below never asks Overpass, and with no OSM data at all it fails, so the site stays as it was.
      - name: OSM (Geofabrik's regional extract)
        continue-on-error: true
        run: python3 tool/extract.py "$(ls -t cache/*.zip | head -1)" --cache cache
      # Geofabrik's extract is about a day behind: every changeset over the area since its time, read from OSM's own
      # API and applied on top (uploads made since, yours included, are in the data). If that fails, the extract as it is.
      - name: OSM caught up to now (changesets since the extract)
        continue-on-error: true
        run: python3 tool/patch.py --since-base
      # with each route's roads: the page reads them instead of asking Overpass itself
      # FEED_ONDEMAND (a variable, optional): an on-demand service whose pickups the feed hasn't, as review.py --ondemand
      # takes it (remix:<project>:<zone>); Cache Valley's, the default feed's, unless set
      - name: the review (stops and routes, and each route's roads)
        env:
          ALSO: ${{ vars.FEED_ALSO }}
          ONDEMAND: ${{ vars.FEED_ONDEMAND || (vars.FEED_QUERY == '' && 'remix:d203b573:POOL' || '') }}
        run: python3 tool/review.py "$(ls -t cache/*.zip | head -1)" --refresh --no-overpass --roads-per-route ${ALSO:+--also "$ALSO"} ${ONDEMAND:+--ondemand "$ONDEMAND"}
      # each publish's scripts and styles at addresses of their own (?v=the commit), so a browser that kept the last
      # ones doesn't run them with this one's (a page stuck on loading until a forced reload)
      - name: this publish's files, not a browser's old copies
        run: sed -i -E "s/(src|href)=\"([a-z0-9/._-]+\.(js|css))\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" web/index.html && grep -c "?v=" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the deploy publishes: the build, which reads other people's feeds, can't
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
